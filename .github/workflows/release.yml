name: Release

# Publishes the library whenever `version` in gradle.properties changes on main (or a tag v<version>
# is pushed), and that version isn't published yet:
#   - builds and tests both Minecraft variants
#   - adds them to the Maven repository on the `maven` branch (never overwrites a published version),
#     served at https://raw.githubusercontent.com/DontTemptFate/Fates_Common/maven
#   - a GitHub Release with the jars and SHA256SUMS.txt

on:
  push:
    branches: [main]
    paths: [gradle.properties]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version=$VERSION"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null && [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"; echo "::notice::v$VERSION is already published"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    name: Build ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        mc: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build, test, publish to a local repo
        run: |
          chmod +x ./gradlew
          ./gradlew build publishMavenJavaPublicationToOutRepository -Pmc=${{ matrix.mc }} --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repo-${{ matrix.mc }}
          path: build/repo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar-${{ matrix.mc }}
          path: build/libs/fatescommon-*+mc${{ matrix.mc }}.jar

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/art
      - name: Add to the maven branch
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "fates-common-release"
          git config user.email "ci@users.noreply.github.com"
          if git ls-remote --exit-code origin maven >/dev/null; then
            git fetch -q origin maven && git worktree add -q /tmp/maven origin/maven && (cd /tmp/maven && git checkout -q -B maven)
          else
            git worktree add -q --orphan -b maven /tmp/maven
          fi
          for d in /tmp/art/repo-*; do
            (cd "$d" && find . -type f) | while read -r f; do
              case "$f" in *maven-metadata*) continue;; esac
              if [ -e "/tmp/maven/$f" ]; then echo "::error::$f is already published"; exit 1; fi
            done
            cp -r "$d"/. /tmp/maven/
          done
          # maven-metadata.xml: list every published version (regenerated from the folders)
          META=/tmp/maven/io/github/donttemptfate/fatescommon
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<metadata><groupId>io.github.donttemptfate</groupId><artifactId>fatescommon</artifactId><versioning><versions>'
            for v in $(ls "$META" | grep -v '\.xml' | grep -v '\.sha\|\.md5' | sort -V); do echo "<version>$v</version>"; done
            echo '</versions></versioning></metadata>'
          } > "$META/maven-metadata.xml"
          (cd "$META" && sha1sum maven-metadata.xml | cut -d' ' -f1 > maven-metadata.xml.sha1 && md5sum maven-metadata.xml | cut -d' ' -f1 > maven-metadata.xml.md5)
          cd /tmp/maven
          git add -A
          git commit -qm "fatescommon v${{ needs.check.outputs.version }}"
          git push -q "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" maven
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist && cp /tmp/art/jar-*/*.jar dist/
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          V="${{ needs.check.outputs.version }}"
          # creates the tag v<version> on this commit when it doesn't exist yet
          gh release create "v$V" dist/* --target "$GITHUB_SHA" --title "Fates Common $V" \
            --notes "Library for the Fates mods (bundled inside them). Maven: https://raw.githubusercontent.com/DontTemptFate/Fates_Common/maven"

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the job that publishes results writes (to the ci-results branch).
permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build and test
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Collect
        if: always()
        run: |
          mkdir -p out/mc${{ matrix.mc }}
          cp build.log out/mc${{ matrix.mc }}/ 2>/dev/null || true
          cp build/libs/*.jar out/mc${{ matrix.mc }}/ 2>/dev/null || true
          echo "result=${{ job.status }}" > out/mc${{ matrix.mc }}/RESULT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fatescommon-mc${{ matrix.mc }}
          path: out/mc${{ matrix.mc }}

  publish:
    needs: build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/ci
      - name: Push to ci-results
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/ci
          { echo "sha=${GITHUB_SHA}"; for d in */; do echo "[${d%/}]"; cat "$d/RESULT" 2>/dev/null || echo "result=missing"; done; } > RESULT
          git init -q -b ci-results
          git config user.name "fates-common-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI result for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the job that publishes results writes (to the ci-results branch).
permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: ["26.2", "26.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build and test
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace --no-daemon 2>&1 | tee build.log
      - name: Collect
        if: always()
        run: |
          mkdir -p out/mc${{ matrix.mc }}
          cp build.log out/mc${{ matrix.mc }}/ 2>/dev/null || true
          cp build/libs/*.jar out/mc${{ matrix.mc }}/ 2>/dev/null || true
          echo "result=${{ job.status }}" > out/mc${{ matrix.mc }}/RESULT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fatescommon-mc${{ matrix.mc }}
          path: out/mc${{ matrix.mc }}

  publish:
    needs: build
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/ci
      - name: Push to ci-results
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/ci
          { echo "sha=${GITHUB_SHA}"; for d in */; do echo "[${d%/}]"; cat "$d/RESULT" 2>/dev/null || echo "result=missing"; done; } > RESULT
          git init -q -b ci-results
          git config user.name "fates-common-ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -qm "CI result for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-results
